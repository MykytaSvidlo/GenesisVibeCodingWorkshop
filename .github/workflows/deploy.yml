name: Deploy to GitHub Pages

on:
  push:
    branches: ["feat/smart-form-bill-of-sale", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      CMS_HOST: "http://localhost:1337"
      CMS_READ_TOKEN: "mock-token"
      ENVIRONMENT: "production"
      WEB_HOST: "mykytasvidlo.github.io"
      BACKEND_HOST: "http://localhost:1337"
      PROJECT_BASE: "/GenesisVibeCodingWorkshop"
      MAIN_APP_BASE: "http://localhost:4322"
      CAPTCHA_SITE_KEY: "mock-key"
      CAPTCHA_LIMIT: 5
      GTAG_ID: "mock-gtag"
      MICROSOFT_CLARITY_ID: "mock-clarity"
      AMPLITUDE_KEY: "mock-amplitude"
      ANALYTICS_PRODUCT: "mock-product"
      GOOGLE_AUTH_CLIENT_ID: "mock-client-id"
      CUSTOMER_IO_KEY: "mock-customerio"
      REACT_APP_SSE_URL: "http://localhost:8080"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build with Astro
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
